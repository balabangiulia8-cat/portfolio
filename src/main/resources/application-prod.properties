# =========================================================
# PRODUCTION PROFILE
# Configurazione usata quando il portfolio è online
# =========================================================

# Thymeleaf
spring.thymeleaf.cache=true

# =========================================================
# ERRORI
# Non mostrare dettagli tecnici agli utenti
# =========================================================
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# =========================================================
# COMPRESSIONE
# Riduce il peso delle risposte HTTP
# =========================================================
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,application/javascript,application/json,text/plain

# =========================================================
# SHUTDOWN
# Permette a Spring di chiudersi in modo ordinato
# =========================================================
server.shutdown=gracefulserver.port=${PORT:8080}
