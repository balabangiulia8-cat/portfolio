<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 | Pagina non trovata</title>

<link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
<link rel="apple-touch-icon" th:href="@{/images/favicon.png}">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="error-page">

<div class="error-container">

<p class="error-code">404</p>

<p class="section-label">Pagina non trovata</p>

<h1>
Questa pagina<br>
non esiste.
</h1>

<p class="error-description">
Il link potrebbe essere errato oppure la pagina potrebbe essere stata spostata.
</p>

<div class="error-actions">
<a th:href="@{/}" class="btn btn-primary">
Torna alla Home
</a>

<a th:href="@{/#projects}" class="btn btn-secondary">
Vai ai progetti
</a>
</div>

</div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/main.js}"></script>

</body>
</html>
