<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex">
<title>500 | Errore del server</title>

<link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
<link rel="apple-touch-icon" th:href="@{/images/favicon.png}">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="error-page">

<div class="error-container">

<p class="error-code">500</p>

<p class="section-label">Errore del server</p>

<h1>
Qualcosa non è<br>
andato come previsto.
</h1>

<p class="error-description">
Si è verificato un errore durante l'elaborazione della richiesta.
Riprova tra qualche momento.
</p>

<div class="error-actions">
<a th:href="@{/}" class="btn btn-primary">
Torna alla Home
</a>

<a th:href="@{/#contact}" class="btn btn-secondary">
Contatti
</a>
</div>

</div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/main.js}"></script>

</body>
</html>
